version: "3.9"

services:
  backend:
    build:
      context: ./packages/backend
    environment:
      TRIAGE_API_KEYS: local-api-key
      TRIAGE_CATCHPROBE_API_KEYS: local-catchprobe-key
      TRIAGE_REPORT_BASE_DIR: /data/storage
    volumes:
      - backend-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./packages/frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  backend-data:

