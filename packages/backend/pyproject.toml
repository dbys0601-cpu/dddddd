[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-triage-service"
version = "0.1.0"
description = "Email triage microservice for CatchProbe integration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CatchProbe Solutions", email = "engineering@catchprobe.example" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "mailparser>=1.16.2",
    "extract-msg>=0.41.0",
    "pyspf>=2.0.14",
    "dkimpy>=1.1.4",
    "yara-python>=4.3.0",
    "python-magic>=0.4.27",
    "email-validator>=2.1.0.post1",
    "orjson>=3.10.3",
    "sentry-sdk>=2.8.1",
    "jinja2>=3.1.4",
    "aiofiles>=23.2.1",
    "typer>=0.12.3",
    "loguru>=0.7.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "respx>=0.20.2",
    "anyio>=4.4.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
addopts = "-q"
